    <h1 style="text-align: center; border: 5px solid #e63e62">Reserve a Table</h1>

    <div align="center" style="color:#000000;">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required placeholder="Enter your name" required maxlength="50">
        <br><br>
       
    </div>
    <div align="center" align-items="center" style="color:#000000; justify-content: center;">
        <label for="guests">Guests:</label>
        <input type="number" id="guests" name="guests" min="1" max="10" required  maxlength="1" placeholder="1-10">
        <br><br>
        <label for="date">Date:</label>
        <input type="date" id="date" name="date" required">
        <br><br>
        <label for="time">Time:</label>
        <input type="time" id="time" name="time" required>
        <br><br>
    </div>
    <div style="text-align: center; color:#000000;">   
        <label for = "payment" aria-required="true">Payment Method:</label>
        <select id="payment" name="payment">
            <option value="cash">Cash</option>
            <option value="Gcash">Gcash</option>
            <option value="PayPal">PayPal</option>
            <option value="Bluetooth">Bluetooth</option>
        </select>
    </div>
    
    <div style="text-align: center; margin-top: 20px; background: #EFEAB5; color: rgb(255, 255, 255);">
        <input type="submit" value="Submit">
        <br><br>
        <input type="reset" value="Cancel">
    </div>

    <div style="text-align: center; margin-top: 20px; background: #efeab5; color: rgb(255, 255, 255);">
